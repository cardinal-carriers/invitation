<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're invited</title>
<meta name="robots" content="noindex, nofollow">

<!-- What the link looks like when it is forwarded. iMessage, WhatsApp and
     Mail all read these, and without them the link shows as a bare
     github.io URL, which reads like something to be careful of.

     The picture is a still of the sealed envelope, kept deliberately
     anonymous: no return address, no postmark date, nothing that has to
     stay in step with the invitation. It is a file, not a render — it
     cannot follow the event data — so it says only what will still be true
     next month. The details are inside, which is the point of an envelope. -->
<meta property="og:type" content="website">
<meta property="og:title" content="You’re invited">
<meta property="og:description" content="A sealed envelope, with your name on it. Tap to open.">
<meta property="og:url" content="https://cardinal-carriers.github.io/invitation/">
<meta property="og:image" content="https://cardinal-carriers.github.io/invitation/assets/og-invitation.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A sealed kraft envelope reading “You’re invited”">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FCF7EE">
<link rel="preload" href="fonts/caveat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/lora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vellum.css">
<link rel="stylesheet" href="envelope.css">
<link rel="stylesheet" href="card-art.css">
<script>document.documentElement.dataset.js='1'</script>
<style>
/* ------------------------------------------------------------------
   THE INVITATION — the one shared link.

   No account, no nav, no product chrome. One letter, forwarded to
   everyone, addressed to whoever is holding it.

   The letter sits below the envelope in ordinary flow and is never
   hidden. Tapping the envelope is the designed path; scrolling is the
   one that always works, including with JavaScript off.
   ------------------------------------------------------------------ */
body{background-image:
  radial-gradient(circle at 18% 12%,rgba(216,155,148,.09),transparent 44%),
  radial-gradient(circle at 84% 26%,rgba(159,186,203,.10),transparent 42%),
  radial-gradient(circle at 58% 92%,rgba(168,183,154,.09),transparent 46%);
  background-attachment:fixed}

.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--s8) var(--s5) var(--s9);text-align:center}
.scene{cursor:pointer}
.scene:focus-visible{outline:2px solid var(--wax);outline-offset:14px;border-radius:12px}
.open-hint{display:flex;align-items:center;gap:12px;margin-top:var(--s5);
  font-family:var(--hand);font-weight:600;font-size:clamp(30px,8vw,40px);
  color:var(--wax);animation:nudge 2.4s ease-in-out infinite}
.open-hint svg{width:46px;height:33px;overflow:visible;flex:none}
.open-hint path{stroke:var(--wax);stroke-width:2;fill:none;stroke-linecap:round;
  stroke-linejoin:round}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
body.opened .open-hint{visibility:hidden}
/* The scene reserves the height the card needs to rise into, so a sealed
   envelope naturally sits low. On a tall screen there is slack to spend
   bringing it back towards the optical centre; on a short one there isn't,
   and clipping the card would cost more than the centring is worth. */
@media (min-height:880px){ .stage .scene{margin-top:-9vh} }

.letter{padding:0 var(--s5) var(--s11)}
/* Nothing below the envelope until it has been opened. This reverses the
   earlier rule that everything stayed reachable by scrolling: the reveal is
   the point of the page, and a card sitting in plain sight underneath spends
   it before the envelope is touched.

   #notice is deliberately not gated — "Not quite ready" and "This didn't
   load" have to reach a guest who has no envelope worth opening. */
body:not(.opened) #sheet,
body:not(.opened) #replyWrap{display:none}
body:not(.opened) .letter{padding-bottom:0}
/* The card and the envelope are the same object seen twice, so they are the
   same width. The scene caps at 560px; this used to cap at 620 and the two
   never lined up. */
.sheet{--sheet-pad:clamp(24px,6vw,56px);max-width:560px;
  padding:var(--s10) var(--sheet-pad) 0;overflow:hidden}

/* --- set like the printed card ---------------------------------------
   The host's template is one muted green serif throughout, with the names
   and the occasion carried by a single script line. Vellum's default
   treatment — an uppercase eyebrow, a display-serif name, a dot rule and a
   labelled detail block — is a different, busier card. This is that card
   restated as the printed one. */
.sheet .eyebrow{font-family:var(--disp);font-size:clamp(15px,3.4vw,17px);font-weight:400;
  letter-spacing:.01em;text-transform:none;color:var(--card-ink);line-height:1.4}
.sheet .honouree{font-family:var(--hand);font-weight:600;
  font-size:clamp(40px,9vw,58px);line-height:.98;letter-spacing:0;
  color:var(--card-ink-hd);text-align:center;margin:var(--s4) 0 0}
.sheet .occasion{font-family:var(--hand);font-weight:600;
  font-size:clamp(36px,8vw,52px);line-height:.98;color:var(--card-ink-hd);
  text-align:center;margin-top:0}

/* Every remaining fact, one centred line each. The card reads as three
   blocks — who and what, then when and where, then the note — so the space
   between the blocks is larger than the space inside them. */
.line{font-family:var(--disp);font-weight:400;text-align:center;
  font-size:clamp(15px,3.5vw,17.5px);line-height:1.55;color:var(--card-ink);
  margin-top:var(--s5)}
.line--when{margin-top:var(--s8)}
/* The time on its own line, under the date. Spaced exactly as a wrapped
   line would be — the point is that it always breaks here, not that it
   looks like a new paragraph. */
.line--when .at{display:block}
.line--reply{font-size:clamp(13.5px,3vw,15px);color:var(--card-ink-2);margin-top:var(--s6)}
.line a{color:inherit;font-size:inherit;text-decoration-color:color-mix(in srgb,var(--card-ink) 40%,transparent)}
.line .sub{display:block;font-size:.94em;color:var(--card-ink-2);margin-top:2px}

/* --- the card artwork -------------------------------------------------
   A host-supplied template paints behind the text. It is its own layer
   rather than a fifth entry in .paper's background stack: that stack is
   four images deep with matched background-size and background-repeat
   lists, and threading another through it breaks the grain.

   Nothing is requested until --card-art is set, so with no file in
   assets/ there is no 404 and nothing to download. See assets/README.md
   for how to switch it on. */
.sheet-inner{display:var(--card-art-rule,block)}
.host-note{font-family:var(--disp);font-weight:400;text-align:center;
  font-size:clamp(15px,3.5vw,17.5px);line-height:1.55;color:var(--card-ink);
  margin-top:var(--s8)}

.sheet-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s3);margin-top:var(--s6)}
.sheet-actions .btn{text-decoration:none}
body:not(.opened) .sheet-actions{display:none}

/* The cue over the reply card. Same hand and same arrow as "Tap to open",
   one size down: it is the same kind of instruction, but the envelope has
   already done the work of getting attention. The arrow is the open-hint's
   turned over, so it points down at the card it is asking about. */
.reply-hint{display:flex;align-items:center;justify-content:center;gap:12px;
  margin:var(--s10) auto var(--s5);font-family:var(--hand);font-weight:600;
  font-size:clamp(24px,6vw,32px);line-height:1.1;color:var(--wax);
  animation:nudge 2.4s ease-in-out infinite}
/* The cue carries the space above the tear line while it is there, and the
   tear line takes it back when it isn't. */
.reply-hint + .reply-perf{margin-top:0}
body.replied .reply-perf{margin-top:var(--s9)}
.reply-hint svg{width:36px;height:26px;overflow:visible;flex:none;transform:scaleY(-1)}
.reply-hint path{stroke:var(--wax);stroke-width:2;fill:none;stroke-linecap:round;
  stroke-linejoin:round}
/* Once they have answered, the card says so and the cue is just noise. */
body.replied .reply-hint{display:none}
@media (prefers-reduced-motion:reduce){.open-hint,.reply-hint{animation:none}}

/* --- the reply card --------------------------------------------------- */
.reply-perf{margin:var(--s9) auto var(--s5)}
/* The REPLIED cancellation runs off the edge of the card, so the card has to
   be the thing that stops it. Without this it overflows the page. */
.reply{overflow:hidden}

/* Names of anyone else coming. Ruled blanks, because this is paper —
   the dashed .add-row belongs to the host's desk, not to a guest's card. */
.others{margin-top:var(--s6)}
.other-row{display:flex;align-items:baseline;gap:var(--s2);margin-top:var(--s4);
  animation:landed .3s cubic-bezier(.26,.9,.3,1)}
@keyframes landed{from{opacity:0;transform:translateY(-6px)}}
.other-row .ruled{font-size:23px}
/* Not .drop — vellum §16 already owns that name for a file drop target. */
.other-row .rm{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-3);transition:background .16s,color .16s}
.other-row .rm:hover{background:color-mix(in srgb,var(--kraft) 30%,transparent);color:var(--ink)}
.other-row .rm svg{width:14px;height:14px}
.add-someone{display:flex;align-items:center;gap:7px;margin:var(--s4) auto 0;padding:8px 14px;
  border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-2);
  transition:background .16s,color .16s}
.add-someone:hover{background:color-mix(in srgb,var(--kraft) 30%,transparent);color:var(--ink)}
.add-someone svg{width:15px;height:15px}

/* A note, folded away until it is wanted. */
.note-fold{margin-top:var(--s6);border-top:var(--perf-fine);padding-top:var(--s5)}
.note-fold > summary{display:flex;align-items:center;justify-content:center;gap:7px;
  list-style:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2);
  padding:6px;border-radius:var(--r-pill);transition:color .16s}
.note-fold > summary::-webkit-details-marker{display:none}
.note-fold > summary:hover{color:var(--ink)}
.note-fold > summary svg{width:14px;height:14px;transition:transform .18s}
.note-fold[open] > summary svg{transform:rotate(45deg)}
.note-fold .ruled-area{margin-top:var(--s4)}

/* One primary action. Everything under it is deliberately quieter. */
.reply-actions{margin-top:var(--s7);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.cant{font-size:14px;color:var(--ink-2);padding:8px 14px;border-radius:var(--r-pill);
  transition:background .16s,color .16s}
/* Declining is a real answer, so it gets a real hover — the same red the
   card uses for a cancelled reply, not a beige nudge. */
.cant:hover,.cant:focus-visible{background:color-mix(in srgb,var(--no) 14%,transparent);
  color:var(--no);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--no) 34%,transparent)}

/* A guest coming back finds the card already cancelled — no replay. */
.reply.settled .cancel,.reply.settled .reply-form{transition:none}
.posted-line{display:none;text-align:center;max-width:560px;margin:var(--s6) auto 0;
  font-size:16.5px;line-height:1.6}
.reply.posted ~ .posted-line{display:block}
.posted-line .again{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:var(--s3)}

/* States that are not the invitation: still loading, or not ready yet. */
.notice{max-width:520px;margin:var(--s9) auto 0;text-align:center;padding:var(--s8) var(--s6)}
.notice .h3{margin-bottom:8px}
.notice p{color:var(--ink-2)}

@media(max-width:560px){
  /* Only the variable: the shorthand would drop padding-bottom to a value
     and the band bleeds out by --sheet-pad, so the two must stay in step. */
  .sheet{--sheet-pad:var(--s5);padding-top:var(--s8)}
  .reply{padding:var(--s8) var(--s5) var(--s7)}
}

/* --- the card artwork -------------------------------------------------
   The band is a real element, not padding with a background behind it.

   It was percentage padding, and that was the bug behind the gap growing as
   the page zoomed out: percentage padding resolves against the CONTAINING
   BLOCK's width, which is .letter and keeps growing, while the band is drawn
   at a percentage of .sheet's own width, which stops at its max-width. The
   two tracked each other only while the card was narrower than its cap.

   aspect-ratio sizes the element from its own width, so there is nothing
   left to diverge. The gap above it is now one fixed value that means what
   it says.

   The box is 1080x775 against an image of 1080x747 — the spare 28px is the
   breath under the characters, so they are not standing on the cut edge. */
.card-band{margin:var(--s6) calc(-1 * var(--sheet-pad)) 0;aspect-ratio:1080/775;
  background-image:var(--card-art,none);background-size:100% auto;
  background-position:center top;background-repeat:no-repeat}

</style>
</head>
<body>
<a class="skip" href="#letter" id="skip">Skip to the invitation</a>

<!-- ============ the envelope. no addressee: one link, everyone ============ -->
<div class="stage">
  <div class="scene" id="sc" role="button" tabindex="0" aria-expanded="false"
       aria-label="Open the envelope"></div>

  <!-- The hint sits below the envelope, so the arrow curves up and back to
       it. Pointing away from the thing you are being asked to tap is worse
       than no arrow. -->
  <p class="open-hint">
    <svg viewBox="0 0 34 24" aria-hidden="true"><path d="M3 21C10 22 22 19 26 4"/><path d="M21 9L26 4l2 7"/></svg>
    Tap to open
  </p>
</div>

<!-- ============ the invitation ============ -->
<main class="letter" id="letter">

  <article class="paper sheet" id="sheet" hidden>
    <div class="sheet-inner" aria-hidden="true"></div>

    <!-- Set the way the host's own template sets it: one small serif line,
         the names and the occasion together in script, then the details as
         plain centred lines. No labels, no rules, no ornament — the printed
         card has none, and the artwork is the ornament. -->
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="honouree" id="honouree"></h1>
    <p class="occasion" id="occasion"></p>

    <p class="line line--when" id="dWhen"></p>
    <p class="line line--where" id="dWhere"></p>
    <p class="host-note" id="hostNote" hidden></p>
    <p class="line line--reply" id="dReplyRow">Reply by <span id="dReply"></span></p>

    <div class="card-band" aria-hidden="true"></div>
  </article>

  <!-- Outside the card. The printed invitation has no button on it, and the
       band runs to the bottom edge — anything placed over it is standing in
       the flowers. -->
  <div class="sheet-actions">
    <button class="btn btn--ghost" data-icon="cal" id="cal">Add to calendar</button>
    <!-- Shown only when the hosts have set one. A registry is an offer, not
         an instruction, so it sits beside the calendar as one more thing a
         guest may want, not on the card as a demand. -->
    <a class="btn btn--ghost" data-icon="gift" id="registry"
       target="_blank" rel="noopener noreferrer" hidden>Gift registry</a>
  </div>

  <!-- ============ the reply card ============ -->
  <div id="replyWrap" hidden>
    <!-- The second of the page's two asks. The first was "tap to open"; this
         is the one that matters, so it is set in the same hand and points the
         same way — at the thing it is asking for, which is below it. -->
    <p class="reply-hint">
      <svg viewBox="0 0 34 24" aria-hidden="true"><path d="M3 21C10 22 22 19 26 4"/><path d="M21 9L26 4l2 7"/></svg>
      Let us know you’ll be there
    </p>
    <p class="reply-perf">Detach and reply</p>

    <form class="paper reply" id="reply" novalidate>
      <div class="postmark cancel" aria-hidden="true">
        <div class="bars"></div>
        <!-- No town on this one. A guest's reply is not franked anywhere,
             and naming a city here only invited the question of which. -->
        <div class="pm1">REPLIED</div><hr class="rule">
        <div class="pm2" id="stampDate">—</div>
      </div>

      <div class="reply-form">
        <p class="rsvp-mark">RSVP</p>

        <div class="blank">
          <label class="sr" for="guestName">Your name</label>
          <input class="ruled" id="guestName" name="name" type="text" maxlength="80"
                 autocomplete="name" placeholder="Your name">
        </div>

        <!-- No heading here. "Add someone" is the whole instruction, and the
             reply card carries no headings beyond the printed RSVP. -->
        <div class="others">
          <div id="otherRows" role="group" aria-label="Anyone with you"></div>
          <button class="add-someone" type="button" id="addOther" data-icon="plus">Add someone</button>
        </div>

        <details class="note-fold">
          <summary data-icon="plus">Add a note</summary>
          <label class="sr" for="note">A note</label>
          <textarea class="ruled-area" id="note" rows="2" maxlength="500"
                    placeholder="Anything we should know"></textarea>
        </details>

        <div class="reply-actions">
          <button class="btn btn--wax btn--lg" type="submit">We'll be there</button>
          <button class="cant" type="button" id="cant">Can't make it</button>
        </div>
      </div>
    </form>

    <p class="posted-line" id="postedLine"></p>
  </div>

  <section class="desk notice" id="notice" hidden>
    <h2 class="h3" id="noticeH"></h2>
    <p id="noticeP"></p>
  </section>
</main>

<script src="config.js"></script>
<script src="dies.js"></script>
<script src="icons.js"></script>
<script src="envelope.js"></script>
<script src="invite.js"></script>
</body>
</html>
